seed: 4
datetime: ${now:%Y-%m-%d}-${now:%H-%M-%S}

data:
  batch_size: 128

# optimizer and scheduling
optimizer:
  name: 'AdamW'
  params:
    lr: 3e-4
    eps: 1e-5
    weight_decay: 0.001
    betas: [0.9, 0.999]
  warmup_fraction: 0.1 # this is per epoch

# lr_scheduler:
#   name: 'ConstantLR'
#   params:
#     factor: 1

lr_scheduler:
  name: 'CosineAnnealingLR'
  params:
    T_max: ${num_epochs}
    eta_min: 3e-5

# wandb configurations
use_wandb: False
clip_grad_norm: 1.0

# training
eval_every: 100 # in terms of epochs
load_from_ckpt: False
exp_dir: ""
mode: train
skip_first_eval: False
num_epochs: 10_000
num_train_envs: 40
num_eval_envs: 5

num_eval_rollouts_save: 2
num_trials: 1
num_eval_explore_trials: 3
debug: False

hp_name: null # TODO: fill this in
run_id: null # TODO: fill this in

defaults:
  - env: bandit
  - model: fete_gpt2
  - local: default 
  - hydra: default 
  - override hydra/launcher: local
  - _self_