seed: 4
datetime: ${now:%Y-%m-%d}-${now:%H-%M-%S}

data:
  batch_size: 128

# optimizer and scheduling
optimizer:
  name: 'AdamW'
  params:
    lr: 3e-4
    eps: 1e-5
    weight_decay: 0.001
    betas: [0.9, 0.999]
  num_warmup_steps: 5 # this is per epoch

lr_scheduler:
  name: 'ConstantLR'
  params:
    factor: 1

# wandb configurations
use_wandb: False
clip_grad_norm: 1.0

# training
eval_every: 5 # in terms of epochs
load_from_ckpt: False
exp_dir: ""
mode: train
skip_first_eval: False
num_epochs: 100
num_train_envs: 1
num_eval_envs: 10
num_trials: 5
debug: False

hp_name: null # TODO: fill this in
run_id: null # TODO: fill this in

defaults:
  - env: bandit
  - model: fete_gpt2
  - local: default 
  - hydra: default 
  - override hydra/launcher: local
  - _self_